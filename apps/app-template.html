<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Name Here - The Luke Files</title>
    <style>
        :root {
            --stone: #4a4a4a;
            --clay: #8b7355;
            --parchment: #f5f1e8;
            --ink: #2c2c2c;
            --sand: #d4c5b0;
            --white: #fafaf8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background-color: var(--parchment);
            color: var(--ink);
            line-height: 1.8;
            padding: 2rem;
        }

        .app-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: var(--white);
            padding: 3rem;
            border: 1px solid var(--sand);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            font-weight: 400;
            color: var(--ink);
        }

        .subtitle {
            color: var(--stone);
            font-style: italic;
            margin-bottom: 2rem;
            font-size: 1rem;
        }

        .input-group {
            margin-bottom: 2rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--stone);
            font-size: 0.95rem;
        }

        input, select, textarea {
            width: 100%;
            padding: 0.75rem;
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: 1rem;
            border: 1px solid var(--sand);
            background-color: var(--parchment);
            color: var(--ink);
            border-radius: 4px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 1rem;
            background-color: var(--clay);
            color: var(--white);
            border: none;
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: 1.1rem;
            cursor: pointer;
            border-radius: 4px;
            transition: opacity 0.3s ease;
        }

        button:hover {
            opacity: 0.8;
        }

        .results {
            margin-top: 2rem;
            padding: 2rem;
            background-color: var(--parchment);
            border: 1px solid var(--sand);
            border-radius: 4px;
        }

        .back-link {
            display: inline-block;
            color: var(--clay);
            text-decoration: none;
            margin-bottom: 2rem;
            font-size: 0.95rem;
            transition: opacity 0.3s ease;
        }

        .back-link:hover {
            opacity: 0.7;
        }

        /* ADD YOUR CUSTOM STYLES HERE */
    </style>
</head>
<body>
    <div class="app-container">
        <a href="../projects.html" class="back-link">← Back to Projects</a>
        
        <h1>Your App Name</h1>
        <p class="subtitle">A brief description of what your app does</p>

        <!-- ADD YOUR APP HTML HERE -->
        <div class="input-group">
            <label for="input1">Input Label</label>
            <input type="text" id="input1" placeholder="Enter something...">
        </div>

        <button onclick="runApp()">Run App</button>

        <div id="results" class="results" style="display: none;">
            <!-- Results will appear here -->
        </div>

    </div>

    <script>
        // ADD YOUR APP JAVASCRIPT HERE
        function runApp() {
            // Your app logic goes here
            
            // Show results
            document.getElementById('results').style.display = 'block';
            document.getElementById('results').innerHTML = 'Your results here';
        }
    </script>
</body>
</html>
