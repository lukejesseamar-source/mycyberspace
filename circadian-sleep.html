<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circadian Sleep Calculator - The Luke Files</title>
    <style>
        :root {
            --stone: #4a4a4a;
            --clay: #8b7355;
            --parchment: #f5f1e8;
            --ink: #2c2c2c;
            --sand: #d4c5b0;
            --white: #fafaf8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background-color: var(--parchment);
            color: var(--ink);
            line-height: 1.8;
            padding: 2rem;
        }

        .app-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: var(--white);
            padding: 3rem;
            border: 1px solid var(--sand);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            font-weight: 400;
            color: var(--ink);
        }

        .subtitle {
            color: var(--stone);
            font-style: italic;
            margin-bottom: 2rem;
            font-size: 1rem;
        }

        .input-group {
            margin-bottom: 2rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--stone);
            font-size: 0.95rem;
        }

        select, input {
            width: 100%;
            padding: 0.75rem;
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: 1rem;
            border: 1px solid var(--sand);
            background-color: var(--parchment);
            color: var(--ink);
            border-radius: 4px;
        }

        button {
            width: 100%;
            padding: 1rem;
            background-color: var(--clay);
            color: var(--white);
            border: none;
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: 1.1rem;
            cursor: pointer;
            border-radius: 4px;
            transition: opacity 0.3s ease;
        }

        button:hover {
            opacity: 0.8;
        }

        .results {
            margin-top: 2rem;
            padding: 2rem;
            background-color: var(--parchment);
            border: 1px solid var(--sand);
            border-radius: 4px;
            display: none;
        }

        .results.show {
            display: block;
        }

        .result-item {
            margin-bottom: 1.5rem;
        }

        .result-item:last-child {
            margin-bottom: 0;
        }

        .result-label {
            font-size: 0.9rem;
            color: var(--stone);
            margin-bottom: 0.25rem;
        }

        .result-value {
            font-size: 1.5rem;
            color: var(--clay);
            font-weight: 400;
        }

        .explanation {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--sand);
            font-size: 0.9rem;
            color: var(--stone);
            line-height: 1.6;
        }

        .back-link {
            display: inline-block;
            color: var(--clay);
            text-decoration: none;
            margin-bottom: 2rem;
            font-size: 0.95rem;
            transition: opacity 0.3s ease;
        }

        .back-link:hover {
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <a href="projects.html" class="back-link">← Back to Projects</a>
        
        <h1>Circadian Sleep Calculator</h1>
        <p class="subtitle">Find your optimal sleep schedule based on Idaho sunrise patterns and circadian rhythm science</p>

        <div class="input-group">
            <label for="month">Select Month (2026)</label>
            <select id="month">
                <option value="0">January</option>
                <option value="1">February</option>
                <option value="2">March</option>
                <option value="3">April</option>
                <option value="4">May</option>
                <option value="5">June</option>
                <option value="6">July</option>
                <option value="7">August</option>
                <option value="8">September</option>
                <option value="9">October</option>
                <option value="10">November</option>
                <option value="11">December</option>
            </select>
        </div>

        <div class="input-group">
            <label for="sleepHours">Desired Sleep Duration (hours)</label>
            <input type="number" id="sleepHours" min="6" max="10" value="8" step="0.5">
        </div>

        <button onclick="calculateSleep()">Calculate Optimal Sleep Schedule</button>

        <div id="results" class="results">
            <div class="result-item">
                <div class="result-label">Sunrise Time</div>
                <div class="result-value" id="sunrise"></div>
            </div>

            <div class="result-item">
                <div class="result-label">Optimal Wake Time</div>
                <div class="result-value" id="wakeTime"></div>
            </div>

            <div class="result-item">
                <div class="result-label">Optimal Bedtime</div>
                <div class="result-value" id="bedTime"></div>
            </div>

            <div class="explanation" id="explanation"></div>
        </div>
    </div>

    <script>
        // Approximate sunrise times for Rexburg, Idaho in 2026 (mid-month averages)
        const sunriseTimes = {
            0: { hour: 8, minute: 0 },   // January
            1: { hour: 7, minute: 30 },  // February
            2: { hour: 7, minute: 0 },   // March
            3: { hour: 6, minute: 15 },  // April
            4: { hour: 5, minute: 45 },  // May
            5: { hour: 5, minute: 30 },  // June
            6: { hour: 5, minute: 45 },  // July
            7: { hour: 6, minute: 15 },  // August
            8: { hour: 6, minute: 45 },  // September
            9: { hour: 7, minute: 15 },  // October
            10: { hour: 7, minute: 45 }, // November
            11: { hour: 8, minute: 0 }   // December
        };

        const monthNames = [
            "January", "February", "March", "April", "May", "June",
            "July", "August", "September", "October", "November", "December"
        ];

        function formatTime(hour, minute) {
            const period = hour >= 12 ? 'PM' : 'AM';
            const displayHour = hour > 12 ? hour - 12 : (hour === 0 ? 12 : hour);
            const displayMinute = minute.toString().padStart(2, '0');
            return `${displayHour}:${displayMinute} ${period}`;
        }

        function calculateSleep() {
            const monthIndex = parseInt(document.getElementById('month').value);
            const sleepDuration = parseFloat(document.getElementById('sleepHours').value);
            
            const sunrise = sunriseTimes[monthIndex];
            
            // Optimal wake time: 30 minutes before sunrise for pre-dawn light exposure
            let wakeHour = sunrise.hour;
            let wakeMinute = sunrise.minute - 30;
            
            if (wakeMinute < 0) {
                wakeMinute += 60;
                wakeHour -= 1;
            }
            
            // Calculate bedtime based on sleep duration
            let bedHour = wakeHour - sleepDuration;
            let bedMinute = wakeMinute;
            
            // Handle negative hours (previous day)
            if (bedHour < 0) {
                bedHour += 24;
            }
            
            // Adjust for sleep cycles (1.5 hour increments for optimal REM)
            const sleepCycles = Math.round(sleepDuration / 1.5);
            
            // Display results
            document.getElementById('sunrise').textContent = formatTime(sunrise.hour, sunrise.minute);
            document.getElementById('wakeTime').textContent = formatTime(wakeHour, wakeMinute);
            document.getElementById('bedTime').textContent = formatTime(bedHour, bedMinute);
            
            document.getElementById('explanation').innerHTML = `
                <strong>Why this schedule?</strong><br><br>
                In ${monthNames[monthIndex]} 2026, sunrise in Idaho occurs around ${formatTime(sunrise.hour, sunrise.minute)}. 
                Your optimal wake time is set 30 minutes before sunrise to allow exposure to pre-dawn light, 
                which helps regulate your circadian rhythm and cortisol awakening response.<br><br>
                With ${sleepDuration} hours of sleep (approximately ${sleepCycles} complete 90-minute sleep cycles), 
                your bedtime should be ${formatTime(bedHour, bedMinute)} to wake naturally with the sun.<br><br>
                <em>Note: This is based on circadian science principles and Idaho's seasonal light patterns. 
                Adjust ±30 minutes based on your individual sleep needs.</em>
            `;
            
            document.getElementById('results').classList.add('show');
        }

        // Auto-select current month
        const currentMonth = new Date().getMonth();
        document.getElementById('month').value = currentMonth;
    </script>
</body>
</html>
